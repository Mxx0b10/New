<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Midnight Delivery</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0612;
      overflow: hidden;
      font-family: "Courier New", monospace;
      color: #ffd9f0;
    }
    #game {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* faint CRT scanline overlay drawn behind canvas via box-shadow vignette */
      box-shadow: inset 0 0 180px rgba(0, 0, 0, 0.85);
    }
    /* Pixel-perfect scaling */
    canvas {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    /* CRT scanline overlay sits above the canvas */
    #crt {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.0) 0px,
        rgba(0, 0, 0, 0.0) 2px,
        rgba(0, 0, 0, 0.18) 3px,
        rgba(0, 0, 0, 0.0) 4px
      );
      mix-blend-mode: multiply;
      z-index: 10;
    }
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
      z-index: 11;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="crt"></div>
  <div id="vignette"></div>

  <!-- Phaser 3 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
